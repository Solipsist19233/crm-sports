<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Історія відвідувань - CRM</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>CRM</h2>
            <button id="mobileToggle" class="mobile-toggle-btn"><i class="fas fa-bars"></i></button>
        </div>
        <ul class="nav-links">
            <li><a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Дашборд</a></li>
            <li><a href="students.html"><i class="fas fa-user-graduate"></i> Учні</a></li>
            <li><a href="groups.html"><i class="fas fa-users"></i> Групи</a></li>
            <li><a href="trainers.html"><i class="fas fa-user-tie"></i> Тренери</a></li>
            <li><a href="assignments.html"><i class="fas fa-calendar-alt"></i> Призначення</a></li>
            <li><a href="attendance.html"><i class="fas fa-clipboard-check"></i> Відвідування</a></li>
            <li><a href="attendance_history.html" class="active"><i class="fas fa-history"></i> Історія відвідувань</a></li>
            <li><a href="payments.html"><i class="fas fa-money-bill-wave"></i> Оплати</a></li>
            <li><a href="subscriptions.html"><i class="fas fa-receipt"></i> Абонементи</a></li>
            <li id="pricesLink"><a href="prices.html"><i class="fas fa-tags"></i> Прайс-лист</a></li>
            <li id="usersLink"><a href="users.html"><i class="fas fa-users-cog"></i> Користувачі</a></li>
            <li><a href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Вийти</a></li>
        </ul>
        <div class="user-info">
            <span id="userName"></span> (<span id="userRoleDisplay"></span>)
        </div>
    </div>
    <div class="main-content">
        <div class="header">
            <h1>Історія відвідувань</h1>
        </div>
        <div class="container">
            <div class="filters-bar">
                <div class="filter-group">
                    <label for="dateFromFilter">З дати:</label>
                    <input type="date" id="dateFromFilter">
                </div>
                <div class="filter-group">
                    <label for="dateToFilter">По дату:</label>
                    <input type="date" id="dateToFilter">
                </div>
                <div class="filter-group">
                    <label for="studentFilter">Учень:</label>
                    <input type="text" id="studentSearchInput" list="studentsDatalist" placeholder="Пошук учня">
                    <datalist id="studentsDatalist"></datalist>
                </div>
                <div class="filter-group">
                    <label for="trainerFilter">Тренер:</label>
                    <select id="trainerFilter">
                        <option value="">Всі тренери</option>
                    </select>
                </div>
                <button class="btn btn-primary" id="applyFiltersBtn"><i class="fas fa-filter"></i> Застосувати фільтри</button>
                <button class="btn btn-secondary" id="resetFiltersBtn"><i class="fas fa-redo"></i> Скинути</button>
            </div>

            <div class="action-bar">
                <button class="btn btn-danger" id="cleanupHistoryBtn"><i class="fas fa-broom"></i> Очистити стару історію</button>
            </div>

            <div class="table-responsive">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Дата</th>
                            <th>Група</th>
                            <th>Тренер</th>
                            <th>Учень</th>
                            <th>Статус</th>
                            <th>Оплата</th>
                            <th>Дії</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody">
                        <!-- History records will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal для редагування запису історії -->
    <div id="editHistoryModal" class="modal">
        <div class="modal-content">
            <span class="close-button" onclick="closeEditHistoryModal()">&times;</span>
            <h2>Редагувати запис історії</h2>
            <form id="editHistoryForm">
                <input type="hidden" id="editHistoryId">
                <div class="form-group">
                    <label for="editStatus">Статус:</label>
                    <select id="editStatus" required>
                        <option value="present">Присутній</option>
                        <option value="absent">Відсутній</option>
                        <option value="sick">Хворий</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="editIsPaid">Оплачено:</label>
                    <input type="checkbox" id="editIsPaid">
                </div>
                <button type="submit" class="btn btn-primary">Зберегти</button>
            </form>
        </div>
    </div>

    <div id="sidebarOverlay" class="overlay"></div>

    <script src="../js/config.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/attendance_history.js"></script>
</body>
</html>
