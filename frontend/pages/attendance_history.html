<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <title>Історія відвідувань - CRM</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>
<body>
    <div id="loadingSpinner" class="loading-spinner hidden"><div class="spinner-icon"></div></div>
    <div id="sidebarOverlay" class="sidebar-overlay"></div>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <i class="fas fa-dumbbell"></i>
                <h2>CRM Школа</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <i class="fas fa-home"></i>
                    <span>Дашборд</span>
                </a>
                <a href="students.html" class="nav-item">
                    <i class="fas fa-users"></i>
                    <span>Учні</span>
                </a>
                <a href="attendance.html" class="nav-item">
                    <i class="fas fa-clipboard-check"></i>
                    <span>Відвідування</span>
                </a>
                <a href="attendance_history.html" class="nav-item active" id="historyLink">
                    <i class="fas fa-history"></i>
                    <span>Історія відвідувань</span>
                </a>
                <a href="assignments.html" class="nav-item" id="assignmentsLink">
                    <i class="fas fa-magic"></i>
                    <span>Призначення</span>
                </a>
                <a href="prices.html" class="nav-item" id="pricesLink">
                    <i class="fas fa-tags"></i>
                    <span>Прайс-лист</span>
                </a>
                <a href="groups.html" class="nav-item">
                    <i class="fas fa-layer-group"></i>
                    <span>Групи</span>
                </a>
                <a href="subscriptions.html" class="nav-item" id="subscriptionsLink">
                    <i class="fas fa-ticket-alt"></i>
                    <span>Абонементи</span>
                </a>
                <a href="users.html" class="nav-item" id="usersLink" style="display: none;">
                    <i class="fas fa-user-cog"></i>
                    <span>Користувачі</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <i class="fas fa-user-circle"></i>
                    <div>
                        <p id="userName">Користувач</p>
                        <small id="userRoleDisplay">Роль</small>
                    </div>
                </div>
                <button class="btn-logout" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i>
                    Вийти
                </button>
            </div>
        </aside>

        <main class="main-content">
            <header class="content-header">
                <div class="header-title-wrap">
                    <button class="mobile-toggle" id="mobileToggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h1>Історія відвідувань</h1>
                </div>
            </header>

            <div class="content-body" style="padding: 20px;">
            <!-- Filters Section as a Card -->
            <div class="history-filters-card">
                <div class="filters-section" style="display: flex; gap: 15px; flex-wrap: wrap; align-items: flex-end;">
                    <div class="filter-group" style="flex: 1; min-width: 150px;">
                        <label>З дати</label>
                        <input type="date" id="dateFromFilter" class="filter-input">
                    </div>
                    <div class="filter-group" style="flex: 1; min-width: 150px;">
                        <label>По дату</label>
                        <input type="date" id="dateToFilter" class="filter-input">
                    </div>
                    <div class="filter-group" style="flex: 2; min-width: 200px;">
                        <label>Учень</label>
                        <input type="text" id="studentSearchInput" list="studentsDatalist" placeholder="Прізвище..." class="filter-input">
                        <datalist id="studentsDatalist"></datalist>
                    </div>
                    <div class="filter-group" style="flex: 1; min-width: 150px;">
                        <label>Тренер</label>
                        <select id="trainerFilter" class="filter-select">
                            <option value="">Всі тренери</option>
                        </select>
                    </div>
                    <div class="filter-group" style="flex: 1; min-width: 150px;">
                        <label>Оплата</label>
                        <select id="paymentFilter" class="filter-select">
                            <option value="">Всі записи</option>
                            <option value="false">Тільки борги</option>
                            <option value="true">Оплачено</option>
                        </select>
                    </div>
                    <div class="filter-group" style="display: flex; gap: 8px; flex-shrink: 0;">
                        <button class="btn btn-primary" id="applyFiltersBtn" title="Застосувати"><i class="fas fa-filter"></i></button>
                        <button class="btn btn-secondary" id="resetFiltersBtn" title="Скинути"><i class="fas fa-redo"></i></button>
                        <button class="btn btn-outline-danger" id="cleanupHistoryBtn" title="Очистити стару історію"><i class="fas fa-broom"></i></button>
                        <button class="btn btn-success" id="exportPdfBtn" title="Експорт у PDF"><i class="fas fa-file-pdf"></i> PDF</button>
                    </div>
                </div>
            </div>

            <!-- Table Section -->
            <div class="table-card">
                <div class="table-container" style="overflow-x: auto;">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Дата</th>
                            <th>Група</th>
                            <th>Тренер</th>
                            <th>Учень</th>
                            <th>Статус</th>
                            <th>Оплата</th>
                            <th>Сума</th>
                            <th>Дії</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody">
                        <!-- History records will be loaded here -->
                    </tbody>
                    <tfoot id="historyTableFooter" class="hidden">
                        <!-- Totals will be here -->
                    </tfoot>
                </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal для редагування запису історії -->
    <div id="editHistoryModal" class="modal">
        <div class="modal-content attendance-history-modal">
            <div class="modal-header">
                <h2>Редагувати історію</h2>
                <button class="modal-close" onclick="closeEditHistoryModal()">&times;</button>
            </div>
            <form id="editHistoryForm" class="modal-form">
                <input type="hidden" id="editHistoryId">
                <div class="form-group">
                    <label for="editStatus">Статус відвідування</label>
                    <select id="editStatus" required>
                        <option value="present">Присутній</option>
                        <option value="absent">Відсутній</option>
                        <option value="sick">Хворий</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="checkbox-container">
                        <input type="checkbox" id="editIsPaid">
                        <span>Відмітити як оплачено</span>
                    </label>
                </div>
                <div class="modal-footer" style="padding: 20px 0 0 0; border-top: 1px solid var(--border-color); margin-top: 20px;">
                    <button type="button" class="btn btn-secondary" onclick="closeEditHistoryModal()">Скасувати</button>
                    <button type="submit" class="btn btn-primary">Зберегти зміни</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="../js/config.js?v=1.1"></script>
    <script src="../js/utils.js?v=1.1"></script>
    <script src="../js/api.js?v=1.1"></script>
    <script src="../js/attendance_history.js?v=1.1"></script>
</body>
</html>
